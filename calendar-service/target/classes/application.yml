spring:
  application:
    name: calendar-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
      config:
        server-addr: localhost:8848
        file-extension: yaml
    sentinel:
      transport:
        dashboard: localhost:8088
        port: 8719
      eager: true
      filter:
        enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/smart_office?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update  # 自动创建/更新表结构
      show-sql: true  # 显示SQL语句
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true  # 格式化SQL语句

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty: DEBUG
    com.alibaba.nacos: DEBUG
    com.graduatedesign.calendarservice: debug

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true

server:
  port: 8083