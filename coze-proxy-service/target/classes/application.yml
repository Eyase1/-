spring:
  application:
    name: coze-proxy-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
    compatibility-verifier:
      enabled: false
    # Sentinel 简化配置
    sentinel:
      enabled: true
      eager: true
      transport:
        dashboard: localhost:8088
        port: 8719

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/smart_office?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8082

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty: DEBUG
    com.alibaba.nacos: DEBUG
    com.graduatedesign.cozeproxyservice: info
    com.alibaba.csp.sentinel: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true

