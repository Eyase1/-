spring:
  application:
    name: knowledge-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
    # Sentinel 简化配置
    sentinel:
      enabled: true
      eager: true
      transport:
        dashboard: localhost:8080
        port: 8719
      web-context-unify: false

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/smart_office?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MinIO配置
minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: documents

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty: DEBUG
    com.alibaba.nacos: DEBUG
    com.graduatedesign.knowledgeservice: debug
    com.alibaba.csp.sentinel: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true

server:
  port: 8084

# 文件上传配置
file:
  upload:
    dir: ./uploads