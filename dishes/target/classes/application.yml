spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://localhost:3306/ai_management
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: dishes

  cloud:
    nacos:
      config:
        import-check:
          enabled: false
        timeout: 5000
        server-addr: localhost:8080
        config-retry-time: 5000
        max-retry: 5


  main:
    allow-bean-definition-overriding: true
server:
  port: 8002



