<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>【营养管理系统】</title>
</head>
<body>
<div style="
    border-radius: 10px 10px 10px 10px;
    font-size: 13px;
    color: #555555;
    width: 666px;
    margin: 50px auto;
    border: 1px solid #eee;
    max-width: 100%;
    background: #ffffff repeating-linear-gradient(-45deg,#fff,#fff 1.125rem,transparent 1.125rem,transparent 2.25rem);
    box-shadow: 0 1px 5px rgb(0 0 0 / 15%);">
    <div style="
    background:#49BDAD;
    color:#ffffff;
    border-radius: 10px 10px 0 0;
    background-image: -moz-linear-gradient(0deg, rgb(67, 198, 184), rgb(255, 209, 244));
    background-image: -webkit-linear-gradient(0deg, rgb(67, 198, 184), rgb(255, 209, 244));
    height: 66px;">
        <p style="font-size:14px;
        word-break:break-all;
        padding: 23px 32px;
        margin:0;
        background-color: hsla(0,0%,100%,.4);
        border-radius: 10px 10px 0 0;">
            来自<a style="text-decoration:none;
            color:#12addb" href="https://www.bilibili.com/">营养管理系统后台</a>的邮件，您正在进行身份验证<a style="text-decoration:none;color:#12addb">(验证码有效期为5分钟)</a>。
        </p>
    </div>
    <div style="margin:20px auto;width:90%">
        <div style="background: #f5f5f5;
        margin:20px 0;
        padding:10px;
        border-radius:5px;
        font-size:14px;
        display: flex;          /* 新增：启用flex布局 */
        justify-content: center;/* 新增：水平居中 */
        align-items: center;    /* 新增：垂直居中 */
        min-height: 50px;       /* 新增：确保最小高度 */
        text-align: center;">
            <p style="font-size: 24px; font-weight: bold;">${code}</p>
        </div>
        <div style="color: #8c8c8c; font-size: 10px;width: 100%;text-align: center;word-wrap: break-word;">
            <p style="padding: 20px">我们不会向你索取任何验证码，请勿暴露验证码于他人。</p>
        </div>
    </div>
</div>
</body>
</html>
